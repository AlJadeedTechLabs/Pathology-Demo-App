<!DOCTYPE html>
<html>
<head>
  <title>Create Lab Account</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Icons -->
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="signup.css">
</head>

<body style="display:none;">

<script>
  const params = new URLSearchParams(window.location.search);
  const token = params.get("token");

  if (token === "AJTL_92xLmP") {
    document.body.style.display = "block";
  } else {
    document.body.innerHTML = `
      <div style="height:100vh;display:flex;align-items:center;justify-content:center;background:#000;color:#fff;font-family:sans-serif;">
        <h2>Access Denied</h2>
      </div>
    `;
  }
</script>



<div class="main-wrapper">

  <div class="signup-card">

    <h3>Create Lab Account</h3>
    <p class="subtitle">Secure pathology dashboard access</p>

    <div class="form-group">
  <input id="labname" type="text" class="form-control custom-input" placeholder="Lab Name">
</div>

<div class="form-group">
  <input id="mobile" type="text"
    class="form-control custom-input"
    placeholder="Mobile Number">
</div>

<div class="form-group">
  <input id="email" type="email" class="form-control custom-input" placeholder="Email Address">
</div>


   

    <!-- Password -->
    <div class="input-group mb-2">
      <input id="password" type="text" class="form-control custom-input" placeholder="Password">
      <div class="input-group-append">
        <button class="btn icon-btn" type="button" id="generateBtn">
          <i class="fa fa-rotate"></i>
        </button>
      </div>
    </div>

    <button class="copy-btn" id="copyBtn">
      <i class="fa fa-copy"></i> Copy Password
    </button>

    <button class="btn signup-btn" id="signupBtn">
      Create Account
    </button>

  </div>

</div>

<style>
  * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  min-height: 100vh;
  background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Center Wrapper */
.main-wrapper {
  width: 100%;
  padding: 20px;
}

/* Glass Card */
.signup-card {
  background: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(20px);
  border-radius: 20px;
  padding: 40px 30px;
  max-width: 420px;
  margin: auto;
  box-shadow: 0 20px 40px rgba(0,0,0,0.4);
  color: #fff;
  text-align: center;
  animation: fadeIn 0.8s ease-in-out;
}

.signup-card h3 {
  font-weight: 600;
  margin-bottom: 5px;
}

.subtitle {
  font-size: 14px;
  opacity: 0.8;
  margin-bottom: 25px;
}

/* Inputs */
.custom-input {
  background: rgba(255,255,255,0.15);
  border: none;
  color: #fff;
  height: 45px;
  border-radius: 10px;
  padding-left: 15px;
}

.custom-input::placeholder {
  color: rgba(255,255,255,0.7);
}

.custom-input:focus {
  background: rgba(255,255,255,0.25);
  box-shadow: none;
  color: #fff;
}

/* Icon Button */
.icon-btn {
  background: rgba(255,255,255,0.2);
  border: none;
  color: white;
  border-radius: 0 10px 10px 0;
}

.icon-btn:hover {
  background: rgba(255,255,255,0.35);
}

/* Copy Button */
.copy-btn {
  background: transparent;
  border: 1px solid rgba(255,255,255,0.4);
  color: #fff;
  padding: 6px 15px;
  border-radius: 20px;
  margin-bottom: 20px;
  transition: 0.3s;
  font-size: 13px;
}

.copy-btn:hover {
  background: #00c6ff;
  border-color: #00c6ff;
}

/* Signup Button */
.signup-btn {
  background: linear-gradient(45deg, #00c6ff, #0072ff);
  border: none;
  color: white;
  padding: 10px;
  width: 100%;
  border-radius: 25px;
  font-weight: 600;
  transition: 0.3s;
}

.signup-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 20px rgba(0, 114, 255, 0.4);
}

/* Animation */
@keyframes fadeIn {
  from {opacity: 0; transform: translateY(20px);}
  to {opacity: 1; transform: translateY(0);}
}

/* Mobile Optimization */
@media(max-width: 480px) {
  .signup-card {
    padding: 30px 20px;
  }
}

</style>

<script type="module">
  import { signup } from "../js/auth.js";

  const passwordInput = document.getElementById("password");

  function generatePassword(length = 14) {
    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+{}[]<>?";
    let pass = "";
    for (let i = 0; i < length; i++) {
      pass += chars[Math.floor(Math.random() * chars.length)];
    }
    return pass;
  }

  document.getElementById("generateBtn").addEventListener("click", () => {
    passwordInput.value = generatePassword();
  });

  document.getElementById("copyBtn").addEventListener("click", () => {
    if (!passwordInput.value) return alert("Generate password first!");
    navigator.clipboard.writeText(passwordInput.value);
    alert("Password copied securely!");
  });

document.getElementById("signupBtn").addEventListener("click", () => {
  signup(
    document.getElementById("email").value,
    document.getElementById("password").value,
    document.getElementById("labname").value,
    document.getElementById("mobile").value
  );
});


</script>

</body>
</html>
