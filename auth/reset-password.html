<!DOCTYPE html>
<html>
<head>
  <title>Reset Password</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
</head>

<body class="container mt-5">

<h3>Set New Password</h3>

<input type="password" id="newPassword" class="form-control mb-3"
       placeholder="Enter New Password">

<button id="updateBtn" class="btn btn-success">
  Update Password
</button>

<p id="message" class="mt-3"></p>

<script type="module">
  import { supabase } from "../js/supabase.js";

  const message = document.getElementById("message");

  // 🔁 Auto session detect from URL
  const hash = window.location.hash;

  if (hash.includes("access_token")) {
    message.innerHTML = "Session verified. Enter new password.";
  } else {
    message.innerHTML = "Invalid or expired reset link.";
    document.getElementById("updateBtn").disabled = true;
  }

  document.getElementById("updateBtn")
    .addEventListener("click", async () => {

    const newPassword =
      document.getElementById("newPassword").value;

    if (newPassword.length < 6) {
      message.innerHTML = "Password must be at least 6 characters.";
      return;
    }

    const { error } = await supabase.auth.updateUser({
      password: newPassword
    });

    if (error) {
      message.innerHTML = error.message;
      return;
    }

    message.innerHTML = "Password updated successfully!";
    
    setTimeout(() => {
      window.location.href = "login.html";
    }, 2000);
  });
</script>

</body>
</html>
