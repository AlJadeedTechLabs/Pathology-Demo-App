<!DOCTYPE html>
<html>
<head>
  <title>Reset Password</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Icons -->
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="signup.css"> <!-- SAME CSS FILE -->
</head>

<body>

<div class="main-wrapper">

  <div class="signup-card">

    <h3>Set New Password</h3>
    <p class="subtitle">Securely update your account password</p>

    <!-- Password Field -->
    <div class="input-group mb-2">
      <input id="newPassword" type="text"
        class="form-control custom-input"
        placeholder="Enter New Password">
      <div class="input-group-append">
        <button class="btn icon-btn" type="button" id="generateBtn">
          <i class="fa fa-rotate"></i>
        </button>
      </div>
    </div>

    <button class="copy-btn mb-3" id="copyBtn">
      <i class="fa fa-copy"></i> Copy Password
    </button>

    <button id="updateBtn" class="btn signup-btn">
      Update Password
    </button>

    <p id="message" class="mt-3 text-light"></p>

  </div>

</div>

<script type="module">
  import { supabase } from "../js/supabase.js";

  const message = document.getElementById("message");
  const passwordInput = document.getElementById("newPassword");

  /* ========= PASSWORD GENERATOR ========= */
  function generatePassword(length = 14) {
    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+{}[]<>?";
    let pass = "";
    for (let i = 0; i < length; i++) {
      pass += chars[Math.floor(Math.random() * chars.length)];
    }
    return pass;
  }

  document.getElementById("generateBtn").addEventListener("click", () => {
    passwordInput.value = generatePassword();
  });

  document.getElementById("copyBtn").addEventListener("click", () => {
    if (!passwordInput.value) return alert("Generate password first!");
    navigator.clipboard.writeText(passwordInput.value);
    alert("Password copied securely!");
  });

  /* ========= AUTO SESSION CHECK ========= */
  const hash = window.location.hash;

  if (hash.includes("access_token")) {
    message.innerHTML = "Session verified. Enter new password.";
  } else {
    message.innerHTML = "Invalid or expired reset link.";
    document.getElementById("updateBtn").disabled = true;
  }

  /* ========= UPDATE PASSWORD ========= */
  document.getElementById("updateBtn")
    .addEventListener("click", async () => {

    const newPassword = passwordInput.value;

    if (newPassword.length < 6) {
      message.innerHTML = "Password must be at least 6 characters.";
      return;
    }

    const { error } = await supabase.auth.updateUser({
      password: newPassword
    });

    if (error) {
      message.innerHTML = error.message;
      return;
    }

    message.innerHTML = "Password updated successfully! Redirecting...";

    setTimeout(() => {
      window.location.href = "login.html";
    }, 2000);
  });

</script>

</body>
</html>
