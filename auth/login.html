      /* ===== FULL BACKGROUND ===== */
body {
  min-height: 100vh;
  background: url('../assets/orbg.png') center center / cover no-repeat;
  position: relative;
  font-family: 'Segoe UI', sans-serif;
}

/* Dark overlay for better contrast */
body::before {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.45);
  backdrop-filter: blur(4px);
  z-index: 0;
}

/* Ensure content stays above overlay */
.container {
  position: relative;
  z-index: 1;
}

         .btn {
    /* font-size: 18px; */
            font-weight: 700;
    padding: 10px;
    border-radius: 7px;
  }
   
  .password-group {
    position: relative;
  }

  .password-group input {
    padding-right: 45px;
  }

.password-toggle {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  cursor: pointer;
  color: #5f6368; /* Google grey */
}

.password-toggle:hover {
  color: #202124;
}

.logout-btn {
    background: linear-gradient(45deg, #e85d7c, #ff0000);
    color: #fff;
}
  /* Hide default browser password reveal icon */
input[type="password"]::-ms-reveal,
input[type="password"]::-ms-clear {
  display: none;
}

input[type="password"]::-webkit-credentials-auto-fill-button,
input[type="password"]::-webkit-textfield-decoration-container {
  display: none !important;
}
/* .password-toggle {

/* ===== GLASS LOGIN CARD ===== */
.login-card {
  background: rgba(255, 255, 255, 0.12);
  backdrop-filter: blur(18px);
  border-radius: 20px;
  padding: 30px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.3);
  border: 1px solid rgba(255,255,255,0.2);
  transition: 0.3s ease;
}

.login-card:hover {
  transform: translateY(-4px);
}

.logo-img {
  width: 100%;
  display: block;
  margin: 0 auto;
}
/* ===== INPUT STYLE ===== */
.form-control {
  background: rgba(255,255,255,0.9);
  border-radius: 7px;
  border: none;
  padding: 12px;
  font-size: 16px;
}

.form-control:focus {
  box-shadow: 0 0 0 3px rgba(102,126,234,0.3);
  border: none;
}
.logout-btn {
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: #fff;
  font-weight: 600;
  border-radius: 14px;
  padding: 12px;
  transition: 0.3s ease;
}

.logout-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 30px rgba(102,126,234,0.5);
}

.login-card {
  animation: floatCard 4s ease-in-out infinite;
}

@keyframes floatCard {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}

<body class="bg-light" style="
        background-image: url('../assets/orbg.png');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
       
        width: 100%;
     ">
 <!-- min-height: 100vh;  -->
  <div class="container">
    <div class="row justify-content-center align-items-center min-vh-100"
    >

      
      <div class="col-12 col-sm-8 col-md-5 col-lg-4">

      <div class="login-card p-4">

        <img src="../assets/whitelogo.png" class="logo-img mb-4" alt="">

          <!-- <h4 class="text-center mb-4">SOFTWARE SOLUTIONS</h4> -->

          <input
            id="email"
            type="email"
            class="form-control mb-3"
            placeholder="Email"
          >


<div class="mb-3 password-group">
  <input
    type="password"
    id="password"
    class="form-control"
    placeholder="Password"
  />

<span class="password-toggle" id="togglePassword">
  <!-- Eye (hidden state) -->
  <svg id="eyeClosed" xmlns="http://www.w3.org/2000/svg"
       width="22" height="22" viewBox="0 0 24 24"
       fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round">
    <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20
             c-7 0-11-8-11-8
             a21.86 21.86 0 0 1 5.06-6.94"/>
    <path d="M1 1l22 22"/>
    <path d="M9.9 4.24A10.94 10.94 0 0 1 12 4
             c7 0 11 8 11 8
             a21.86 21.86 0 0 1-4.87 6.94"/>
  </svg>

  <!-- Eye (visible state) -->
  <svg id="eyeOpen" xmlns="http://www.w3.org/2000/svg"
       width="22" height="22" viewBox="0 0 24 24"
       fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round"
       style="display:none">
    <path d="M1 12s4-8 11-8
             11 8 11 8
             -4 8-11 8
             -11-8-11-8z"/>
    <circle cx="12" cy="12" r="3"/>
  </svg>
</span>



</div>






          <button class="logout-btn btn btn-primary  btn-block" id="loginBtn" style="border: none;">
            Login
          </button>
        </div>

      </div>
    </div>
  </div>

  <script type="module">
    import { login } from "../js/auth.js";

    document.getElementById("loginBtn").addEventListener("click", () => {
      login(
        document.getElementById("email").value,
        document.getElementById("password").value
      );
    });
  </script>
<script>
  const password = document.getElementById("password");
  const toggle = document.getElementById("togglePassword");
  const eyeOpen = document.getElementById("eyeOpen");
  const eyeClosed = document.getElementById("eyeClosed");

  toggle.addEventListener("click", () => {
    const isHidden = password.type === "password";

    password.type = isHidden ? "text" : "password";
    eyeOpen.style.display = isHidden ? "block" : "none";
    eyeClosed.style.display = isHidden ? "none" : "block";
  });
</script>
